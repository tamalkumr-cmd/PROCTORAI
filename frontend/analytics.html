<body>

<header>
  <div class="hbar">
    <div class="mark">ProctorAI <span>/ analytics</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="whoami" id="who">—</div>
  </div>
</header>

<div class="wrap">
  <div class="intro">
    <div>
      <h1>Exam analytics</h1>
      <p>How the paper performed, where students struggled, and what proctoring cost.</p>
    </div>
    <div class="pick"><select id="examPick" onchange="load()"><option>Loading exams…</option></select></div>
  </div>

  <div id="content">
    <div class="panel empty" style="margin-top:22px"><b>Pick an exam</b>Choose an exam above to see its analytics.</div>
  </div>
</div>

<script src="pa.js"></script>
<script>
const paSession = PA.require("proctors");
if (!paSession) throw new Error("redirecting");
PA.mountNav("nav", "who", paSession);
const idToken = paSession.token;
const API = PA.API;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const api = p => fetch(`${API}${p}`, { headers:{ Authorization:`Bearer ${idToken}` } }).then(r => r.json());

(async () => {
  const d = await api("/exams");
  const list = (d.exams || []).filter(e => e.status !== "draft");
  if (!list.length){ $("examPick").innerHTML = `<option>No published exams</option>`; return; }
  $("examPick").innerHTML = `<option value="">Select an exam…</option>`
    + list.map(e => `<option value="${esc(e.exam_id)}">${esc(e.title)}</option>`).join("");
  const q = new URLSearchParams(location.search).get("exam");
  if (q && list.some(e => e.exam_id === q)){ $("examPick").value = q; load(); }
})();

function difficulty(f){
  if (f === null || f === undefined) return ["p-na","not marked"];
  if (f >= 80) return ["p-easy","easy"];
  if (f >= 35) return ["p-mid","moderate"];
  return ["p-hard","hard"];
}
const facColour = f => f === null ? "var(--line)" : f >= 80 ? "var(--calm)" : f >= 35 ? "var(--slate)" : "var(--alert)";

async function load(){
  const id = $("examPick").value;
  if (!id) return;
  history.replaceState(null, "", `?exam=${encodeURIComponent(id)}`);
  $("content").innerHTML = `<div class="panel empty" style="margin-top:22px"><b>Crunching numbers…</b></div>`;

  const d = await api(`/analytics?exam_id=${encodeURIComponent(id)}`);
  if (d.error){ $("content").innerHTML = `<div class="panel empty" style="margin-top:22px"><b>${esc(d.error)}</b></div>`; return; }

  const c = d.cohort, g = d.integrity, T = d.total_marks || 1;
  if (!c.submissions){
    $("content").innerHTML = `<div class="panel empty" style="margin-top:22px"><b>No submissions yet</b>
      Analytics appear once students submit this exam.</div>`;
    return;
  }

  const pct = v => Math.round(v / T * 100);
  const maxBand = Math.max(...c.bands, 1);
  const bandLabels = ["0–20","20–40","40–60","60–80","80–100"];
  const bandColour = i => i < 2 ? "var(--alert)" : i === 2 ? "var(--watch)" : "var(--calm)";

  const hist = c.bands.map((n,i) => `
    <div class="hcol">
      <span class="hcount">${n}</span>
      <div class="hbar" style="height:${n / maxBand * 130}px;background:${bandColour(i)};opacity:${n?0.85:0.25}"></div>
      <span class="hlabel">${bandLabels[i]}%</span>
    </div>`).join("");

  const qrows = d.questions.map(q => {
    const [cls,label] = difficulty(q.facility);
    return `<tr>
      <td class="qn">Q${q.n}</td>
      <td class="qt">${esc(q.text)}<small>${q.type === "mcq" ? "multiple choice" : "written"} · ${q.max_marks} marks</small></td>
      <td class="num">${q.attempted}/${c.submissions}</td>
      <td><div class="fac">
        <div class="ftrack"><i style="width:${q.facility ?? 0}%;background:${facColour(q.facility)}"></i></div>
        <span class="num" style="width:44px;text-align:right">${q.facility === null ? "—" : q.facility + "%"}</span>
      </div></td>
      <td><span class="pill ${cls}">${label}</span></td>
    </tr>`;
  }).join("");

  const mcqs = d.questions.filter(q => q.type === "mcq" && q.options.length);
  const distractors = mcqs.map(q => {
    const total = q.options.reduce((t,o) => t + o.count, 0) || 1;
    const right = q.options.find(o => o.correct);
    const topWrong = q.options.filter(o => !o.correct).sort((a,b) => b.count - a.count)[0];
    const warn = right && topWrong && topWrong.count > right.count;
    return `<div class="dq">
      <div class="dq-head"><span class="qn">Q${q.n}</span><b>${esc(q.text)}</b></div>
      ${q.options.map(o => `
        <div class="drow">
          <span class="did">${esc(o.id.toUpperCase())}</span>
          <span class="dtext" title="${esc(o.text)}">${esc(o.text)}</span>
          <div class="dtrack"><i style="width:${o.count / total * 100}%;background:${o.correct ? "var(--calm)" : "var(--alert)"};opacity:${o.correct ? 0.85 : 0.55}"></i></div>
          <span class="dn">${o.count} ${o.correct ? "✓" : ""}</span>
        </div>`).join("")}
      ${warn ? `<div class="warnnote">More students picked <b>${esc(topWrong.id.toUpperCase())}</b> than the correct answer.
        Worth checking the answer key, or covering this misconception in class.</div>` : ""}
    </div>`;
  }).join("");

  const flaggedMean = g.flagged_mean_pct, cleanMean = g.clean_mean_pct;
  let integrityNote;
  if (flaggedMean === null) integrityNote = "No session in this exam raised a proctoring flag.";
  else if (cleanMean === null) integrityNote = "Every session raised at least one flag, so there's no clean group to compare against.";
  else {
    const gap = Math.round((flaggedMean - cleanMean) * 10) / 10;
    integrityNote = gap > 5
      ? `Flagged sessions scored <b>${gap} points higher</b> on average than clean ones. That's worth a closer look at the flagged clips before releasing results.`
      : gap < -5
        ? `Flagged sessions scored <b>${Math.abs(gap)} points lower</b> than clean ones — flags here look more like environment problems (lighting, camera angle) than advantage.`
        : `Flagged and clean sessions scored within 5 points of each other, so flags don't appear to be linked to an advantage.`;
  }

  $("content").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${c.submissions}<span style="font-size:13px;color:var(--muted)">/${c.roster_size}</span></div><div class="k">Submitted</div></div>
      <div class="stat"><div class="v">${c.mean}</div><div class="k">Mean of ${d.total_marks}</div></div>
      <div class="stat"><div class="v">${c.median}</div><div class="k">Median</div></div>
      <div class="stat"><div class="v">${c.high}<span style="font-size:13px;color:var(--muted)"> / ${c.low}</span></div><div class="k">High / low</div></div>
      <div class="stat"><div class="v">${Math.round(c.pass_count / c.submissions * 100)}%</div><div class="k">Passed (≥40%)</div></div>
      <div class="stat"><div class="v">${c.avg_minutes}</div><div class="k">Avg minutes</div></div>
    </div>

    <div class="two">
      <section class="panel">
        <div class="panel-head"><h2>Score distribution</h2><span class="hint">students per band</span></div>
        <div class="body">
          <div class="hist">${hist}</div>
          <div class="passline"><b>${c.pass_count}</b> of ${c.submissions} students scored 40% or more.
            Mean is <b>${pct(c.mean)}%</b>, median <b>${pct(c.median)}%</b>.</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Proctoring cost</h2><span class="hint">Rekognition at $0.001 / image</span></div>
        <div class="body">
          <div class="crow"><span class="cl">Every frame to AWS</span>
            <div class="ctrack"><div class="cfill f-naive" style="width:100%"></div></div>
            <span class="cv">$${g.cost_naive.toFixed(3)}</span></div>
          <div class="crow"><span class="cl">With on-device filter</span>
            <div class="ctrack"><div class="cfill f-real" style="width:${Math.max(g.cost_naive ? g.cost_actual / g.cost_naive * 100 : 0, 0.8)}%"></div></div>
            <span class="cv">$${g.cost_actual.toFixed(3)}</span></div>
          <div style="margin-top:14px">
            <div class="kv"><span>Frames checked</span><b>${g.frames_checked}</b></div>
            <div class="kv"><span>Resolved on student devices</span><b>${g.calls_avoided}</b></div>
            <div class="kv"><span>Cloud calls avoided</span><b style="color:var(--calm)">${g.savings_pct}%</b></div>
          </div>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top:20px">
      <div class="panel-head"><h2>Question difficulty</h2><span class="hint">facility = marks earned ÷ marks available</span></div>
      <table>
        <thead><tr><th>#</th><th>Question</th><th>Attempted</th><th>Facility</th><th>Rating</th></tr></thead>
        <tbody>${qrows}</tbody>
      </table>
    </section>

    <div class="two">
      <section class="panel">
        <div class="panel-head"><h2>Answer choices</h2><span class="hint">green is the correct option</span></div>
        ${distractors || `<div class="empty" style="padding:36px 20px">This exam has no multiple-choice questions.</div>`}
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Integrity</h2><span class="hint">${g.sessions_flagged} of ${c.submissions} sessions flagged</span></div>
        <div class="body">
          <div class="cmp">
            <div class="cbox ${flaggedMean !== null ? "bad" : ""}">
              <div class="v">${flaggedMean === null ? "—" : flaggedMean + "%"}</div>
              <div class="k">Mean score, flagged sessions</div>
            </div>
            <div class="cbox ok">
              <div class="v">${cleanMean === null ? "—" : cleanMean + "%"}</div>
              <div class="k">Mean score, clean sessions</div>
            </div>
          </div>
          <p class="small">${integrityNote}</p>
          <div class="kv" style="margin-top:6px"><span>Flags raised</span><b>${g.flags_raised}</b></div>
          <p class="small" style="margin-top:14px"><a href="grade.html" style="color:var(--slate)">Review flagged clips while marking →</a></p>
        </div>
      </section>
    </div>

    ${c.submissions < 5 ? `<div class="caution">Only ${c.submissions} submission${c.submissions>1?"s":""} so far.
      Difficulty and integrity comparisons become meaningful with more students.</div>` : ""}
  `;
}
</script>
</body>
</html>
