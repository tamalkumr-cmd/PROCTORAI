<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProctorAI — My Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#FBFCFD; --panel:#FFFFFF; --ink:#16202B; --muted:#66788A;
  --line:#E3E9EF; --line-soft:#EFF3F7; --slate:#2D4A63;
  --calm:#167C55; --calm-bg:#E8F4EE;
  --watch:#B26A00; --watch-bg:#FBF1E0;
  --alert:#C3352B; --alert-bg:#FBEBEA;
  --r:10px;
}
*{box-sizing:border-box}
body{margin:0; background:var(--surface); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; line-height:1.5}
.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:820px; margin:0 auto; padding:0 28px 72px}

header{border-bottom:1px solid var(--line); background:var(--panel)}
.hbar{max-width:820px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.mark{font-family:"Archivo",sans-serif; font-weight:700; font-size:17px; letter-spacing:-.02em}
.mark span{color:var(--muted); font-weight:500}
.nav{margin-left:6px}
.nav a{padding:5px 11px; border-radius:6px; font-size:13px; color:var(--muted); text-decoration:none}
.nav a:hover{background:var(--surface); color:var(--ink)}
.whoami{margin-left:auto; font-size:12px; color:var(--muted)}

.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 11px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r)}

/* score card — signature */
.score{padding:30px 28px; margin-top:26px; text-align:center}
.score h1{font-family:"Archivo",sans-serif; font-size:22px; letter-spacing:-.02em; margin:0 0 20px; font-weight:600}
.dial{display:flex; align-items:baseline; justify-content:center; gap:6px; margin-bottom:6px}
.dial .n{font-family:"Archivo",sans-serif; font-size:64px; font-weight:700; letter-spacing:-.04em; line-height:1}
.dial .d{font-family:"IBM Plex Mono",monospace; font-size:22px; color:var(--muted)}
.pct{font-size:14px; color:var(--muted); margin-bottom:20px}
.gauge{height:12px; border-radius:6px; background:var(--line-soft); overflow:hidden; max-width:420px; margin:0 auto}
.gauge i{display:block; height:100%; width:0%; transition:width .7s cubic-bezier(.4,0,.2,1)}
.pending{margin-top:18px; padding:12px 14px; background:var(--watch-bg); color:var(--watch);
  border-radius:8px; font-size:13px; max-width:460px; margin-left:auto; margin-right:auto}

.fb{padding:20px 22px; margin-top:18px; border-left:3px solid var(--slate)}
.fb p{margin:0; font-size:14.5px; line-height:1.65; white-space:pre-wrap}

/* breakdown */
.panel-head{padding:15px 20px 12px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.panel-head h2{margin:0; font-family:"Archivo",sans-serif; font-size:14px; font-weight:600; letter-spacing:-.01em}
.hint{font-size:12px; color:var(--muted); margin-left:auto}
.q{padding:20px 22px; border-bottom:1px solid var(--line-soft)}
.q:last-child{border-bottom:0}
.q-head{display:flex; align-items:baseline; gap:10px; margin-bottom:11px; flex-wrap:wrap}
.q-n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:.07em}
.awarded{margin-left:auto; display:inline-flex; padding:3px 10px; border-radius:20px;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600}
.a-full{background:var(--calm-bg); color:var(--calm)}
.a-part{background:var(--watch-bg); color:var(--watch)}
.a-zero{background:var(--alert-bg); color:var(--alert)}
.a-wait{background:var(--line-soft); color:var(--muted)}
.q-text{font-size:15px; line-height:1.6; margin:0 0 13px; max-width:70ch}
.ans{padding:13px 15px; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  font-size:14.5px; line-height:1.65; white-space:pre-wrap}
.ans.blank{color:var(--muted); font-style:italic}
.mcq{display:flex; flex-direction:column; gap:7px}
.mopt{display:flex; align-items:flex-start; gap:10px; padding:9px 13px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); font-size:14px}
.mopt .oid{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); width:16px; flex-shrink:0}
.mopt.right{border-color:var(--calm); background:var(--calm-bg)}
.mopt.wrong{border-color:var(--alert); background:var(--alert-bg)}
.mopt .lbl{margin-left:auto; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em}
.small{font-size:12.5px; color:var(--muted); margin-top:9px}

.empty{padding:56px 22px; text-align:center; color:var(--muted); font-size:13.5px}
.empty b{display:block; color:var(--ink); font-weight:600; margin-bottom:5px; font-size:15px}
.btn{padding:9px 18px; font-size:13.5px; font-family:inherit; font-weight:500; border-radius:7px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink); text-decoration:none; display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--slate); border-color:var(--slate); color:#fff}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="mark">ProctorAI <span>/ result</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="whoami" id="who">—</div>
  </div>
</header>

<div class="wrap">
  <div id="content">
    <div class="panel empty" style="margin-top:26px"><b>Loading your result…</b></div>
  </div>
</div>

<script src="pa.js"></script>
<script>
const DOMAIN    = "https://ap-south-1yx4st7fyc.auth.ap-south-1.amazoncognito.com";
const CLIENT_ID = "4aeuraag6jvio5kp81i32sjll5";
const API       = "https://nju6z5l8hh.execute-api.ap-south-1.amazonaws.com";
const REDIRECT  = window.location.origin + window.location.pathname;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const EXAM_ID = new URLSearchParams(location.search).get("exam");

/* ---------- auth ---------- */
  const paSession = PA.require("students");
  if (!paSession) throw new Error("redirecting");
  let idToken = paSession.token;
  PA.mountNav("nav", "who", paSession);
/* ---------- load ---------- */
(async () => {
  if (!EXAM_ID){
    $("content").innerHTML = `<div class="panel empty" style="margin-top:26px">
      <b>No exam selected</b>Go back to <a href="student.html">my exams</a> and pick one.</div>`;
    return;
  }

  const d = await fetch(`${API}/result?exam_id=${encodeURIComponent(EXAM_ID)}`,
    { headers:{ Authorization:`Bearer ${idToken}` } }).then(r => r.json());

  if (d.error){
    $("content").innerHTML = `<div class="panel empty" style="margin-top:26px">
      <b>${esc(d.error)}</b>Your instructor will release results when marking is done.
      <p style="margin-top:18px"><a class="btn" href="student.html">Back to my exams</a></p></div>`;
    return;
  }

  const pct = d.total_marks ? Math.round(d.awarded / d.total_marks * 100) : 0;
  const colour = pct >= 60 ? "var(--calm)" : pct >= 40 ? "var(--watch)" : "var(--alert)";

  const rows = (d.breakdown || []).map((q,i) => {
    const waiting = q.awarded === null || q.awarded === undefined;
    const cls = waiting ? "a-wait"
      : q.awarded === q.max_marks ? "a-full"
      : q.awarded === 0 ? "a-zero" : "a-part";
    const label = waiting ? "not marked" : `${q.awarded} / ${q.max_marks}`;

    let bodyHtml;
    if (q.type === "mcq"){
      const opts = q.options || [];
      bodyHtml = opts.length ? `<div class="mcq">${opts.map(o => {
        const right = o.id === q.correct_option_id, picked = o.id === q.your_answer;
        const cl = right ? "right" : (picked ? "wrong" : "");
        const lb = right ? `<span class="lbl" style="color:var(--calm)">correct answer</span>`
          : (picked ? `<span class="lbl" style="color:var(--alert)">you chose</span>` : "");
        return `<div class="mopt ${cl}"><span class="oid">${o.id.toUpperCase()}</span><span>${esc(o.text)}</span>${lb}</div>`;
      }).join("")}</div>`
      : `<div class="ans ${q.your_answer?"":"blank"}">${q.your_answer
          ? "You chose option " + esc(String(q.your_answer).toUpperCase()) : "Not answered"}</div>
         <div class="small">Correct answer: option ${esc(String(q.correct_option_id||"").toUpperCase())}</div>`;
    } else {
      const blank = !String(q.your_answer||"").trim();
      bodyHtml = `<div class="ans ${blank?"blank":""}">${blank ? "You didn't answer this question" : esc(q.your_answer)}</div>`;
    }

    return `<div class="q">
      <div class="q-head">
        <span class="q-n">QUESTION ${String(i+1).padStart(2,"0")} · ${q.type==="mcq"?"MULTIPLE CHOICE":"WRITTEN"}</span>
        <span class="awarded ${cls}">${label}</span>
      </div>
      <p class="q-text">${esc(q.text)}</p>
      ${bodyHtml}
    </div>`;
  }).join("");

  $("content").innerHTML = `
    <section class="panel score">
      <h1>${esc(d.exam_title)}</h1>
      <div class="dial">
        <span class="n" style="color:${colour}">${d.awarded}</span>
        <span class="d">/ ${d.total_marks}</span>
      </div>
      <div class="pct">${pct}%</div>
      <div class="gauge"><i style="width:${pct}%; background:${colour}"></i></div>
      ${d.graded ? "" : `<div class="pending">Some written answers are still being marked. Your score may go up.</div>`}
    </section>

    ${d.feedback ? `<section class="panel fb">
      <p class="eyebrow">Feedback from your instructor</p>
      <p>${esc(d.feedback)}</p>
    </section>` : ""}

    <section class="panel" style="margin-top:18px">
      <div class="panel-head">
        <h2>Question breakdown</h2>
        <span class="hint">${(d.breakdown||[]).length} questions</span>
      </div>
      ${rows || `<div class="empty">No questions to show</div>`}
    </section>

    <p style="margin-top:22px"><a class="btn primary" href="student.html">Back to my exams</a></p>`;
})();
</script>
</body>
</html>
